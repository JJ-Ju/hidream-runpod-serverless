[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hidream-runpod-serverless"
version = "0.1.0"
description = "RunPod Serverless worker for HiDream O1 image generation"
requires-python = ">=3.10"
dependencies = [
  "runpod>=1.7.6",
  "boto3>=1.34",
  "requests>=2.32",
  "transformers==4.57.1",
  "diffusers>=0.35",
  "accelerate>=1.1",
  "einops>=0.8",
  "numpy>=1.26",
  "Pillow>=10",
  "tqdm>=4.66",
  "scipy>=1.11",
  "huggingface_hub>=0.30",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
