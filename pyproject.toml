[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hidream-runpod-serverless"
version = "0.1.0"
description = "RunPod Serverless worker for HiDream O1 image generation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "runpod==1.9.0",
  "boto3==1.43.9",
  "requests==2.34.2",
  "transformers==4.57.1",
  "diffusers==0.35.2",
  "accelerate==1.13.0",
  "einops==0.8.2",
  "numpy==2.2.6",
  "Pillow==12.2.0",
  "tqdm==4.67.3",
  "scipy==1.15.3",
  "huggingface_hub==0.36.0",
  "safetensors==0.7.0",
  "tokenizers==0.22.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
